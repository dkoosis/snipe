version: "2"

# Fleet canonical golangci-lint config (from repo-standard), plus snipe's own
# additions marked "snipe:". lint-set fails a repo whose .golangci.yml does not enable every linter below
# or weakens one of the settings lint-set names (nolintlint, errcheck,
# gocritic's ruleguard wiring, forbidigo's context.Background rule). It is the
# union of what ferret, sdlc, loto, canapay and trixi enable, minus depguard
# (README "Canonical linter set" says why). A repo may enable more. It drops
# one only by name and reason in docs/repo-standard.json:
#   {"rule": "lint-set", "drop": {"<linter>": "<reason>"}}
# repo-standard --fix writes this file only into a repo that has none.

run:
  tests: true

linters:
  # golangci's standard set (errcheck, govet, ineffassign, staticcheck, unused)
  # stays under the list; staticcheck is named so the floor is explicit.
  default: standard
  enable:
    # Error handling
    - errchkjson
    - errorlint
    - nilerr
    - nilnesserr

    # Safety
    - bodyclose
    - containedctx
    - forbidigo
    - forcetypeassert
    - gosec
    - predeclared
    - rowserrcheck
    - sqlclosecheck
    - unqueryvet

    # Complexity and duplication

    # Enum and type safety
    - exhaustive
    - makezero
    - musttag
    - reassign

    # Style and correctness
    - asciicheck
    - copyloopvar
    - dupword
    - durationcheck
    - errname
    - exptostd
    - fatcontext
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - godoclint
    - grouper
    - inamedparam
    - intrange
    - iotamixing
    - loggercheck
    - misspell
    - modernize
    - nakedret
    - nilnil
    - nolintlint
    - prealloc
    - recvcheck
    - revive
    - sloglint
    - staticcheck
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

    # Performance
    - mirror
    - perfsprint

    # snipe: kept from the config this replaces
    - tparallel
    - whitespace

    # Testing
    - testifylint
    - thelper
    - usetesting

  # Dropped for snipe, each by exception in docs/repo-standard.json (burn-down
  # beads sn-*): noctx, wrapcheck, err113, cyclop, gocyclo, gocognit, nestif, funlen, dupl.
  # noctx is also on the lint-floor exception.
  disable:
    - godox
    - wsl

  settings:
    exhaustive:
      # A default clause marks the remaining enum cases as handled on purpose.
      default-signifies-exhaustive: true
    errcheck:
      # A blank-discarded error (`x, _ := f()`, `_ = f()`) fails too; lint-set
      # fails a repo that leaves this off. Test files are exempt below.
      check-blank: true
      # Only calls whose dropped error is harmless. lint-set fails a repo that
      # excludes any other function.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Print
        - fmt.Println
        - fmt.Fprint
        - fmt.Fprintln
    goconst:
      min-len: 4
      min-occurrences: 5
      ignore-tests: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # The lintbrush rules pack (.golangci-rules/, checked by lint-pack).
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # snipe requires dkoosis/atomicfile, so pack rule 2 (raw write of
          # durable state) runs: optin_rawstatewrite.go is listed.
          rules: "${base-path}/.golangci-rules/bugclasses.go,${base-path}/.golangci-rules/modern.go,${base-path}/.golangci-rules/optin_rawstatewrite.go"
          # Fail the run on a rule that does not compile.
          failOn: dsl
      disabled-checks:
        - appendCombine
        - commentFormatting
        - deprecatedComment
        - hugeParam
        - ifElseChain
        - unlambda
    forbidigo:
      # Pack rule 5: deep in a daemon, thread the caller's ctx. Path-scoped in
      # exclusions below. Types-aware so a ctx.Background field cannot misfire.
      analyze-types: true
      forbid:
        - pattern: '^context\.Background$'
          msg: "thread the caller/shutdown ctx; context.Background belongs only at a daemon's root (main/startup)"
    wrapcheck:
      # snipe: its own packages already wrap with context where the error starts.
      ignore-package-globs:
        - github.com/dkoosis/snipe/*
    cyclop:
      max-complexity: 15
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 15
    nestif:
      min-complexity: 5
    nakedret:
      max-func-lines: 20
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: bare-return
          disabled: true
        - name: var-naming
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: error-return
          disabled: false
        - name: dot-imports
          disabled: false
        - name: waitgroup-by-value
          disabled: false
    staticcheck:
      checks:
        - all
    testifylint:
      enable-all: true
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests: security, complexity, context, wrapping and duplication rules
      # are production-code concerns; table tests repeat by design.
      - linters:
          - gosec
          - noctx
          - unparam
          - wrapcheck
          - dupl
        path: _test\.go
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
        path: _test\.go
      # check-blank covers production code only: a blank assignment in a test
      # is not reported, a bare unchecked call in a test still is. Same entry
      # as lintbrush gorules/golangci.baseline.yml.
      - path: _test\.go$
        linters:
          - errcheck
        text: Error return value
        source: '(^|[^A-Za-z0-9_.])_\s*(,\s*[A-Za-z0-9_]+\s*)*(:=|=[^=])|,\s*_\s*(:=|=[^=])'
      # A command's main.go wires flags and subcommands.
      - linters:
          - cyclop
          - funlen
          - gocognit
          - gocyclo
          - nestif
        path: cmd/.*/main\.go
      - linters:
          - gocritic
        path: cmd/.*/main\.go
        text: exitAfterDefer
      # Pack rule 5: context.Background is legitimate at a command's root and
      # in tests. golangci reports module-root-relative paths, so match
      # `(^|/)cmd/`, never `/cmd/`.
      - linters:
          - forbidigo
        path: '(_test\.go$|(^|/)cmd/|(^|/)main\.go$)'
        text: 'context\.Background'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dkoosis/snipe
  exclusions:
    generated: lax
