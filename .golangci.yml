version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.24"

linters:
  enable:
    # Defaults
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional
    - bodyclose
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - goconst
    - gocritic
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - predeclared
    - tparallel
    - unconvert
    - unparam
    - whitespace
  disable:
    # Temporarily disabled - many pre-existing issues
    - errcheck     # 59 issues - unchecked errors
    - dogsled      # 5 issues - blank identifiers
    - dupl         # 2 issues - duplicate code
    - funlen       # 4 issues - long functions
    - gocognit     # 3 issues - complex functions
    - godot        # 74 issues - comment periods
    - gosec        # 18 issues - security concerns
    - nestif       # nested if depth
    - prealloc     # 1 issue - preallocations
    - revive       # 22 issues - various style
    - wrapcheck    # 41 issues - error wrapping
    - gocyclo      # cyclomatic complexity

  settings:
    dogsled:
      max-blank-identifiers: 4

    dupl:
      threshold: 150

    funlen:
      lines: 100
      statements: 50

    gocognit:
      min-complexity: 20

    gocyclo:
      min-complexity: 15

    goconst:
      min-len: 3
      min-occurrences: 5

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      # bugclasses pack (ccp-sbp, decision nug d7ea466a8172): the ruleguard
      # checker runs the shared machine rules for the recurring cross-repo Go
      # defect classes (scanner-buffer, err-substring, pid-liveness). Rules live
      # in .golangci-rules/bugclasses.go — a verbatim copy of the upstream pack,
      # drift-guarded by scripts/check-pack-drift.sh.
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          # ${base-path} = the .golangci.yml directory (golangci-lint v2). The
          # glob names ONLY bugclasses.go, so rule 2 (raw-state-write, the
          # opt-in file) stays off — snipe adopts the always-on rules only.
          rules: "${base-path}/.golangci-rules/bugclasses.go"
          # Fail the run on rule-compile errors — never silently skip them.
          failOn: dsl
      disabled-checks:
        - hugeParam

    forbidigo:
      # bugclasses rule 5: context.Background() deep in daemon code should
      # thread the caller/shutdown ctx (strand st-47z, trixi #606,
      # trixi-bot gg-8rq.3, canapay can-x38). Path-scoped in exclusions below to
      # snipe's non-daemon paths. Types-aware so a `ctx.Background` field can't
      # misfire. Setting `forbid` replaces forbidigo's defaults, so the stock
      # fmt.Print* bans stay off — only context.Background is forbidden.
      analyze-types: true
      forbid:
        - pattern: '^context\.Background$'
          msg: "thread the caller/shutdown ctx; context.Background belongs only at a daemon's root (main/startup)"

    godot:
      scope: declarations
      capital: false

    nestif:
      min-complexity: 4

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    wrapcheck:
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
      ignore-package-globs:
        - github.com/dkoosis/snipe/*

    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    rules:
      # Test files can be longer
      - path: _test\.go
        linters:
          - funlen
          - dupl
          - gocognit
          - goconst
          - gocritic

      # Main can have longer functions
      - path: main\.go
        linters:
          - funlen

      # Allow fmt.Fprintf to stderr in commands
      - path: cmd/
        linters:
          - forbidigo
        text: "fmt.Fprintf"

      # bugclasses rule 5 (forbidigo Background ban) is noise everywhere except
      # long-lived daemon paths. context.Background is legitimate at snipe's
      # root (root main.go, cmd/ subcommand startup) and in tests. snipe is a
      # CLI/indexer, not a resident daemon — the ban guards the watcher/indexer
      # goroutines that must thread the run/shutdown ctx.
      - linters:
          - forbidigo
        path: '(_test\.go$|(^|/)cmd/|(^|/)main\.go$)'
        text: 'context\.Background'

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dkoosis/snipe

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
