# ============================================================
# Weights
# ============================================================
#
# Weights reflect frequency × "how stuck is the agent if this fails?"
# High weight = used often AND no good fallback exists.
# Low weight = either infrequent or has decent alternatives (grep, file listing).
#
# Weights are normalized — they must sum to 1.0.
# The harness computes both unweighted (equal task contribution) and
# weighted (category importance) aggregates.
#
weights:
  search: 0.25         # concept→symbol has no fallback; this is what saves the agent
  def: 0.20            # most frequent command, but search+read is a passable fallback
  refs: 0.18           # no fallback for type/interface references; critical for safe refactoring
  callers: 0.12        # grep can approximate, but misses interface dispatch
  pack: 0.08           # convenience (chains def+refs+callers), tests command integration
  cross-cutting: 0.07  # most realistic proxy for actual agent workflow
  impl: 0.05           # infrequent but irreplaceable when needed (Go interface polymorphism)
  pkg: 0.03            # orientation; tree/ls are decent alternatives
  callees: 0.02        # least common, useful for dependency tracing

# ============================================================
# Scoring rubric
# ============================================================
#
# Aligned with Agentless (ref:#379d10c): binary hit metrics at
# file and symbol granularity predict downstream success better
# than continuous metrics like MAP/MRR.
#
scoring:
  # Primary metrics (binary, per-task)
  file_accuracy:
    description: "Did snipe output contain at least one expected_file? (binary)"
    notes: "Maps to Agentless file-level % Correct Location"

  symbol_accuracy:
    description: "Did snipe output contain all expected_symbols? (binary)"
    notes: "Maps to Agentless function-level % Correct Location"

  call_efficiency:
    description: "actual_calls <= max_calls (binary pass/fail)"
    notes: "Unique to us — measures tool value vs grep baseline"

  # Optional / secondary (compute but don't optimize for)
  mrr:
    description: "1/rank of first expected symbol in output"
    notes: "Fine to report, but binary metrics are what correlate with solve rate"

  # Aggregates
  aggregates:
    - name: "file_acc"
      formula: "% of tasks where file_accuracy = true"
      target: "> 90% (LocAgent achieves 92.7%)"
    - name: "symbol_acc"
      formula: "% of tasks where symbol_accuracy = true"
      target: "> 75%"
    - name: "efficiency"
      formula: "% of tasks completed within max_calls"
      target: "> 80%"
    - name: "baseline_ratio"
      formula: "avg(snipe_calls) / avg(grep_calls) for same localization"
      target: "< 0.5 (snipe should be 2x fewer calls than grep)"

# ============================================================
# Task distribution
# ============================================================
distribution:
  search: 17        # ~22% — concept-to-symbol, hardest
  def: 15           # ~20% — most common single call
  cross-cutting: 12 # ~16% — multi-step traces, most realistic
  refs: 8           # ~11% — impact analysis, no fallback
  callers: 6        # ~8%  — call chain tracing
  callees: 6        # ~8%  — dependency understanding
  pack: 4           # ~5%  — deep dives, command integration
  impl: 4           # ~5%  — interface navigation
  pkg: 4            # ~5%  — orientation
  # Total: 38 tasks across 4 codebases
  # Known gaps: 3 (bbolt unexported types)
  # Scored: 73
