# ============================================================
# COBRA (medium codebase, ~10k LOC, CLI framework)
# repo: github.com/spf13/cobra
# ============================================================
cobra:
  - id: cobra-def-01
    category: def
    task: "Find how a command is executed"
    commands: ["def Command.Execute"]
    expected_symbols:
      - "Command.Execute"
    max_calls: 1
    difficulty: easy

  - id: cobra-def-02
    category: def
    task: "Find how flags are parsed from arguments"
    commands: ["def Command.ParseFlags"]
    expected_symbols:
      - "Command.ParseFlags"
    max_calls: 1
    difficulty: easy

  - id: cobra-def-03
    category: def
    task: "Find the unexported execute method"
    commands: ["def Command.execute"]
    expected_symbols:
      - "Command.execute"
    expected_files:
      - "command.go"
    max_calls: 1
    difficulty: medium
    notes: "Lowercase unexported method. Tests whether def resolves private methods on exported types."

  # --- refs ---

  - id: cobra-refs-01
    category: refs
    task: "Find all code that references the Command type"
    commands: ["refs Command"]
    expected_symbols:
      - "Command"
    expected_files:
      - "command.go"
    max_calls: 1
    difficulty: hard
    notes: "Command is used everywhere in cobra. Tests whether refs handles high-fanout types. Many results expected."

  # --- callers ---

  - id: cobra-callers-01
    category: callers
    task: "Find all internal callers of command execution"
    commands: ["callers Command.execute"]
    expected_symbols:
      - "Command.ExecuteC"  # public wrapper that calls execute
    max_calls: 1
    difficulty: medium

  # --- callees ---

  - id: cobra-callees-01
    category: callees
    task: "Find what happens inside Command.execute"
    commands: ["callees Command.execute"]
    expected_symbols:
      - "Command.ParseFlags"
      - "Command.ValidateArgs"
    expected_files:
      - "command.go"
    max_calls: 1
    difficulty: medium
    notes: "execute is the core dispatch. Callees should reveal: flag parsing, pre-run hooks, run function, post-run hooks."

  # --- pack ---

  - id: cobra-pack-01
    category: pack
    task: "Get complete context for Command.Execute"
    commands: ["pack Command.Execute"]
    expected_symbols:
      - "Command.Execute"
      - "Command.ExecuteC"
    expected_files:
      - "command.go"
    max_calls: 1
    difficulty: easy
    notes: "Execute is the entry point. Pack should show def, who calls it, and what it calls."

  # --- search ---

  - id: cobra-search-01
    category: search
    task: "Find how shell completions are generated"
    commands: ["search 'completion'", "search 'bash completion'"]
    expected_symbols:
      - "GenBashCompletion"
      - "GenZshCompletion"
    expected_files:
      - "completions.go"
      - "bash_completions.go"
      - "zsh_completions.go"
    max_calls: 2
    difficulty: medium
    notes: "Multiple files involved. Quality = does the agent find all completion backends?"

  - id: cobra-search-02
    category: search
    task: "Find how help text is generated and customized"
    commands: ["search 'HelpFunc'", "search 'UsageFunc'"]
    expected_symbols:
      - "Command.Help"
      - "Command.HelpFunc"
      - "Command.SetHelpFunc"
      - "Command.UsageFunc"
    max_calls: 2
    difficulty: medium

  - id: cobra-search-03
    category: search
    task: "Find error handling patterns"
    commands: ["search 'error'", "search 'ErrHelp'"]
    expected_symbols: []
    expected_files:
      - "command.go"
    max_calls: 2
    difficulty: hard
    notes: "Deliberately vague query. Tests whether search surfaces useful results for broad concepts."

  # --- cross-cutting ---

  - id: cobra-cross-01
    category: cross-cutting
    task: "Trace argument validation from user input to error"
    commands: ["def Command.ValidateArgs", "search 'Args'", "def PositionalArgs"]
    expected_symbols:
      - "Command.ValidateArgs"
      - "PositionalArgs"       # type for arg validators
      - "MinimumNArgs"
      - "ExactArgs"
    max_calls: 3
    difficulty: hard

  - id: cobra-cross-02
    category: cross-cutting
    task: "Assess impact of changing Command.Execute"
    commands: ["refs Command.Execute", "callers Command.execute", "callees Command.execute"]
    expected_symbols:
      - "Command.Execute"
      - "Command.ExecuteC"
    expected_files:
      - "command.go"
    max_calls: 3
    difficulty: hard
    notes: "Impact analysis workflow: who uses it (refs) + who calls it (callers) + what it depends on (callees)."

# ============================================================
# BBOLT (small codebase, ~8k LOC, embedded key/value store)
# repo: go.etcd.io/bbolt
# ============================================================
bbolt:
  - id: bbolt-def-01
    category: def
    task: "Find how transactions are committed"
    commands: ["def Tx.Commit"]
    expected_symbols:
      - "Tx.Commit"
    max_calls: 1
    difficulty: easy

  - id: bbolt-def-02
    category: def
    task: "Find how buckets are created"
    commands: ["def Bucket.CreateBucket"]
    expected_symbols:
      - "Bucket.CreateBucket"
    max_calls: 1
    difficulty: easy

  # --- refs ---

  - id: bbolt-refs-01
    category: refs
    task: "Find all code that references the DB type"
    commands: ["refs DB"]
    expected_symbols:
      - "DB"
    expected_files:
      - "db.go"
    max_calls: 1
    difficulty: medium
    notes: "DB is the root type. Refs should span db.go, tx.go, bucket.go, and test files."

  # --- callers ---

  - id: bbolt-callers-01
    category: callers
    task: "Find all code that allocates new pages"
    commands: ["callers DB.allocate"]
    expected_symbols:
      - "Tx.allocate"   # direct caller; Tx.Commit reaches DB.allocate transitively via Tx.allocate
    max_calls: 1
    difficulty: hard
    notes: "Internal function. Tests whether callers resolves private methods. Direct caller only — Tx.Commit is 2-hop via Tx.allocate."

  # --- callees ---

  - id: bbolt-callees-01
    category: callees
    task: "Find what Tx.Commit calls during commit"
    commands: ["callees Tx.Commit"]
    expected_symbols:
      - "Tx.commitFreelist"
      - "Tx.write"
    expected_files:
      - "tx.go"
    max_calls: 1
    difficulty: medium
    notes: "Commit is complex — should reveal: page allocation, freelist management, data write, metadata sync."

  # --- search ---

  - id: bbolt-search-01
    category: search
    task: "Find the B+ tree node splitting logic"
    commands: ["search 'split'", "def node.split"]
    expected_symbols:
      - "node.split"
      - "node.splitIndex"
    expected_files:
      - "node.go"
    max_calls: 2
    difficulty: medium
    known_gap: true
    notes: "Unexported methods on unexported types not resolvable by def."

  - id: bbolt-search-02
    category: search
    task: "Find how the freelist tracks available pages"
    commands: ["search 'freelist'", "def freelist.free"]
    expected_symbols:
      - "freelist"
      - "freelist.free"
      - "freelist.allocate"
    expected_files:
      - "freelist.go"
    max_calls: 2
    difficulty: medium
    known_gap: true
    notes: "Unexported methods on unexported types not resolvable by def."

  # --- cross-cutting ---

  - id: bbolt-cross-01
    category: cross-cutting
    task: "Trace a Put operation from API through B+ tree to disk write"
    commands: ["def Bucket.Put", "def node.put", "callers node.spill"]
    expected_symbols:
      - "Bucket.Put"
      - "node.put"
      - "node.spill"
      - "Tx.Commit"
    max_calls: 3
    difficulty: hard
    known_gap: true
    notes: "Full write path. node.put and node.spill are unexported methods on unexported types."

# ============================================================
# FZF (large codebase, ~20k LOC, fuzzy finder)
# repo: github.com/junegunn/fzf
# ============================================================
fzf:
  - id: fzf-def-01
    category: def
    task: "Find the core fuzzy matching algorithm"
    commands: ["search 'FuzzyMatch'", "def FuzzyMatchV2"]
    expected_symbols:
      - "FuzzyMatchV2"
    expected_files:
      - "src/algo/algo.go"
    max_calls: 2
    difficulty: medium
    notes: "Agent may not know the exact function name."

  - id: fzf-def-02
    category: def
    task: "Find the Run function (ambiguous — multiple packages may define Run)"
    commands: ["def Run"]
    expected_symbols:
      - "Run"
    expected_files: []
    max_calls: 1
    difficulty: hard
    notes: "Ambiguous name. Tests disambiguation across packages. Any Run function is a valid hit."

  # --- refs ---

  - id: fzf-refs-01
    category: refs
    task: "Find all code that references the Options type"
    commands: ["refs Options"]
    expected_symbols:
      - "Options"
    expected_files:
      - "src/options.go"
    max_calls: 1
    difficulty: medium
    notes: "Options struct at src/options.go:565. Central config type — refs should span many files."

  # --- search ---

  - id: fzf-search-01
    category: search
    task: "Find how terminal input events are processed"
    commands: ["search 'Terminal'", "search 'Loop'"]
    expected_symbols:
      - "Terminal.Loop"
    expected_files:
      - "src/terminal.go"
    max_calls: 2
    difficulty: hard
    notes: "Large file, many methods. Quality = finding the main event loop."

  - id: fzf-search-02
    category: search
    task: "Find how results are ranked and sorted"
    commands: ["search 'rank'", "search 'ByRelevance'"]
    expected_symbols:
      - "ByRelevance"
      - "Result"
    max_calls: 2
    difficulty: hard

  - id: fzf-search-03
    category: search
    task: "Find the scoring and bonus logic for match quality"
    commands: ["search 'bonus'", "search 'score'"]
    expected_symbols: []
    expected_files:
      - "src/algo/algo.go"
    max_calls: 2
    difficulty: hard
    notes: "Conceptual search. 'bonus' and 'score' appear in the fuzzy matching algorithm for match quality."

  # --- cross-cutting ---

  - id: fzf-cross-01
    category: cross-cutting
    task: "Trace user input from keypress through matching to display"
    commands: ["def Terminal.Loop", "search 'matcher'", "search 'printList'"]
    expected_symbols:
      - "Terminal.Loop"
      - "FuzzyMatchV2"
    max_calls: 4
    difficulty: hard
    notes: "End-to-end data flow across packages. Hardest localization task."

# ============================================================
# Weights
# ============================================================
#
# Weights reflect frequency × "how stuck is the agent if this fails?"
# High weight = used often AND no good fallback exists.
# Low weight = either infrequent or has decent alternatives (grep, file listing).
#
# Weights are normalized — they must sum to 1.0.
# The harness computes both unweighted (equal task contribution) and
# weighted (category importance) aggregates.
#
weights:
  search: 0.25         # concept→symbol has no fallback; this is what saves the agent
  def: 0.20            # most frequent command, but search+read is a passable fallback
  refs: 0.18           # no fallback for type/interface references; critical for safe refactoring
  callers: 0.12        # grep can approximate, but misses interface dispatch
  pack: 0.08           # convenience (chains def+refs+callers), tests command integration
  cross-cutting: 0.07  # most realistic proxy for actual agent workflow
  impl: 0.05           # infrequent but irreplaceable when needed (Go interface polymorphism)
  pkg: 0.03            # orientation; tree/ls are decent alternatives
  callees: 0.02        # least common, useful for dependency tracing

# ============================================================
# Scoring rubric
# ============================================================
#
# Aligned with Agentless (ref:#379d10c): binary hit metrics at
# file and symbol granularity predict downstream success better
# than continuous metrics like MAP/MRR.
#
scoring:
  # Primary metrics (binary, per-task)
  file_accuracy:
    description: "Did snipe output contain at least one expected_file? (binary)"
    notes: "Maps to Agentless file-level % Correct Location"

  symbol_accuracy:
    description: "Did snipe output contain all expected_symbols? (binary)"
    notes: "Maps to Agentless function-level % Correct Location"

  call_efficiency:
    description: "actual_calls <= max_calls (binary pass/fail)"
    notes: "Unique to us — measures tool value vs grep baseline"

  # Optional / secondary (compute but don't optimize for)
  mrr:
    description: "1/rank of first expected symbol in output"
    notes: "Fine to report, but binary metrics are what correlate with solve rate"

  # Aggregates
  aggregates:
    - name: "file_acc"
      formula: "% of tasks where file_accuracy = true"
      target: "> 90% (LocAgent achieves 92.7%)"
    - name: "symbol_acc"
      formula: "% of tasks where symbol_accuracy = true"
      target: "> 75%"
    - name: "efficiency"
      formula: "% of tasks completed within max_calls"
      target: "> 80%"
    - name: "baseline_ratio"
      formula: "avg(snipe_calls) / avg(grep_calls) for same localization"
      target: "< 0.5 (snipe should be 2x fewer calls than grep)"

# ============================================================
# Task distribution
# ============================================================
distribution:
  search: 17        # ~22% — concept-to-symbol, hardest
  def: 15           # ~20% — most common single call
  cross-cutting: 12 # ~16% — multi-step traces, most realistic
  refs: 8           # ~11% — impact analysis, no fallback
  callers: 6        # ~8%  — call chain tracing
  callees: 6        # ~8%  — dependency understanding
  pack: 4           # ~5%  — deep dives, command integration
  impl: 4           # ~5%  — interface navigation
  pkg: 4            # ~5%  — orientation
  # Total: 76 tasks across 5 codebases (38 orca, 38 other)
  # Known gaps: 3 (bbolt unexported types)
  # Scored: 73
