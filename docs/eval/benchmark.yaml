# Snipe Localization Benchmark
#
# Measures: can snipe get an LLM agent to the right code in minimal calls?
# Baseline: Grep + Glob + Read (the fallback stack)
#
# Scoring:
#   hit@1:    first result contains a target symbol
#   recall@N: all target symbols appear within top N results
#   calls:    number of snipe invocations to find all targets
#   baseline: number of Grep/Glob calls to achieve the same
#
# ============================================================
# Related work / existing benchmarks
# ============================================================
#
# Agentless (ICML 2024) — arxiv.org/abs/2407.01489
#   Hierarchical localization: file → class/function → line.
#   Evaluated on SWE-bench Lite (300 Python tasks from GitHub issues).
#   Metrics: Top-N, MAP, MRR at each granularity level.
#   Key finding: localization quality determines end-to-end fix rate.
#   Limitation for us: Python only, SWE-bench tasks, no Go.
#
# LocAgent (ACL 2025) — aclanthology.org/2025.acl-long.426
#   Graph-guided LLM agents for code localization.
#   Introduced Loc-Bench: 660 tasks (282 bugs, 203 features, 31 security, 144 perf).
#   Metrics: file-level accuracy (92.7%), function-level accuracy, NDCG.
#   Uses directed heterogeneous code graph (files, classes, functions + deps).
#   Closest to what we're doing — but evaluates the agent, not the tool.
#
# DeepCodeBench (Qodo, 2025) — qodo.ai/blog/deepcodebench
#   Q&A benchmark from real PRs requiring multi-file retrieval.
#   Metrics: "fact recall" (discrete verifiable facts in answer).
#   Tests retrieval depth, not just localization.
#   Best scores: ~76-80% fact recall. Claude ~64%.
#
# Jarmak (2026) — "Rethinking Coding Agent Benchmarks"
#   Key insight: current benchmarks containerize full repos, so
#   "grep is all you need" — doesn't test realistic retrieval.
#   Proposes: stripped-docs Kubernetes as harder target, ablation
#   studies with/without code intelligence tools (MCP).
#   Metrics: IR metrics (MRR, precision, recall, NDCG) + pass@k.
#   Pipeline: Harbor framework → SQLite metrics DB → analyzers.
#
# CrossCodeEval (NeurIPS 2023) — amazon-science/cceval
#   Cross-file code completion requiring cross-file context.
#   10k examples, 1k repos, 4 languages (no Go).
#   Metrics: exact match, edit similarity, identifier match.
#
# How this benchmark differs:
#   - Measures the TOOL (snipe), not the agent or LLM
#   - Go-specific, uses real symbol resolution not text search
#   - Baseline is grep+glob (the actual fallback), not "no tool"
#   - Focuses on call efficiency (fewer round-trips = faster agent)
#   - Reproducible without LLM: script snipe commands, check output

# ============================================================
# ORCA (medium codebase, ~30k LOC, MCP server + knowledge graph)
# repo: github.com/anthropics/orca (or local)
# ============================================================
orca:
  # --- def tasks (direct symbol lookup) ---

  - id: orca-def-01
    category: def
    task: "Find the function that saves a nugget to the database"
    commands: ["def Store.Save"]
    expected_symbols:
      - "Store.Save"  # internal/kg/sqlite/store.go:310
    expected_files:
      - "internal/kg/sqlite/store.go"
    max_calls: 1
    difficulty: easy
    notes: "Exact symbol name. Should be a single call."

  - id: orca-def-02
    category: def
    task: "Find how nugget IDs are generated"
    commands: ["def nug.GenerateID"]
    expected_symbols:
      - "GenerateID"  # internal/kg/nug/id.go:16
    expected_files:
      - "internal/kg/nug/id.go"
    max_calls: 1
    difficulty: easy

  - id: orca-def-03
    category: def
    task: "Find the nugget deduplication logic"
    commands: ["def Deduplicator.CheckDuplicate"]
    expected_symbols:
      - "Deduplicator.CheckDuplicate"  # internal/kg/linker/dedup.go:67
    expected_files:
      - "internal/kg/linker/dedup.go"
    max_calls: 1
    difficulty: easy

  - id: orca-def-04
    category: def
    task: "Find the Save function without knowing the receiver type"
    commands: ["def Save"]
    expected_symbols:
      - "Store.Save"
    expected_files:
      - "internal/kg/sqlite/store.go"
    max_calls: 1
    difficulty: medium
    notes: "Unqualified name — tests disambiguation. 'Save' is ambiguous; Store.Save should rank high."

  # --- refs tasks (impact analysis — who uses this?) ---

  - id: orca-refs-01
    category: refs
    task: "Find all code that references the Store interface"
    commands: ["refs Store"]
    expected_symbols:
      - "Store"
    expected_files:
      - "internal/kg/store.go"
      - "internal/kg/sqlite/store.go"
    max_calls: 1
    difficulty: medium
    notes: "Store interface defined at internal/kg/store.go, implemented by sqlite.Store. Refs should span multiple packages."

  - id: orca-refs-02
    category: refs
    task: "Find all code that references the Embedder interface"
    commands: ["refs Embedder"]
    expected_symbols:
      - "Embedder"
    expected_files:
      - "internal/kg/embedder/embedder.go"
    max_calls: 1
    difficulty: medium
    notes: "Embedder interface at embedder.go:28. Referenced by linker, store, and test code."

  - id: orca-refs-03
    category: refs
    task: "Find all code that references the Tool interface"
    commands: ["refs Tool"]
    expected_symbols:
      - "Tool"
    expected_files:
      - "internal/tool/tool.go"
    max_calls: 1
    difficulty: hard
    notes: "Common name 'Tool' may be ambiguous. Tests whether refs resolves to the right interface."

  # --- callers tasks (impact analysis) ---

  - id: orca-callers-01
    category: callers
    task: "Find all code paths that save nuggets"
    commands: ["callers Store.Save"]
    expected_symbols: []
    expected_files:
      - "internal/kg/linker/linker.go"
      - "internal/kg/mgmt/service.go"
    max_calls: 1
    difficulty: medium
    notes: "Callers returns direct callers of Save, not transitive. Expected files validated instead of symbols since direct caller names vary."

  - id: orca-callers-02
    category: callers
    task: "Find what triggers embedding computation"
    commands: ["callers Embed"]
    expected_symbols: []
    expected_files:
      - "internal/kg/"
    max_calls: 2
    difficulty: medium
    notes: "Interface method — callers depend on how Embed is resolved. Expect any caller in kg."

  - id: orca-callers-03
    category: callers
    task: "Find all places that call the LLM"
    commands: ["callers Client.Reflect"]
    expected_symbols: []
    expected_files:
      - "internal/kg/linker/"  # uses LLM for classification/enrichment
      - "internal/kg/ner/"     # uses LLM for extraction
    max_calls: 1
    difficulty: medium
    notes: "Critical for cost analysis — callers command returns calling functions, not the callee itself."

  # --- callees tasks (dependency understanding) ---

  - id: orca-callees-01
    category: callees
    task: "Find what the linker pipeline calls during processing"
    commands: ["callees Linker.Process"]
    expected_symbols:
      - "Linker.processClassify"
      - "Linker.processDedup"
    expected_files:
      - "internal/kg/linker/linker.go"
    max_calls: 1
    difficulty: medium
    notes: "Linker.Process is the central pipeline function. Direct callees are the process* pipeline stages (classify, dedup, NER, name, semantic, enrich)."

  # --- pack tasks (deep dive — def + refs + callers + callees) ---

  - id: orca-pack-01
    category: pack
    task: "Get complete context for Store.Save"
    commands: ["pack Store.Save"]
    expected_symbols:
      - "Store.Save"
      - "saveNug"            # direct caller in cmd handlers
    expected_files:
      - "internal/kg/sqlite/store.go"
    max_calls: 1
    difficulty: easy
    notes: "Pack should return def + refs + callers + callees in one call. Tests command integration. Direct callers are saveNug, kgBackfillTriggersCommand, kgReindexCommand (Linker.Process is transitive)."

  - id: orca-pack-02
    category: pack
    task: "Get complete context for the Embedder interface"
    commands: ["pack Embedder"]
    expected_symbols:
      - "Embedder"
    expected_files:
      - "internal/kg/embedder/embedder.go"
    max_calls: 1
    difficulty: medium
    notes: "Interface pack should show definition, all implementations, and all call sites."

  # --- impl tasks (interface → implementations) ---

  - id: orca-impl-01
    category: impl
    task: "Find all types that implement the Embedder interface"
    commands: ["impl Embedder"]
    expected_symbols:
      - "Embedder"
    expected_files:
      - "internal/kg/embedder/"
    max_calls: 1
    difficulty: medium
    notes: "Should find VoyageEmbedder and any other implementations. Critical for understanding polymorphic dispatch."

  - id: orca-impl-02
    category: impl
    task: "Find all types that implement the Store interface"
    commands: ["impl kg.Store"]
    expected_symbols:
      - "Store"
    expected_files:
      - "internal/kg/sqlite/store.go"
    max_calls: 1
    difficulty: medium
    notes: "kg.Store interface at store.go:17, implemented by sqlite.Store. Qualified name avoids ambiguity with telemetry.Store."

  # --- pkg tasks (orientation / exploration) ---

  - id: orca-pkg-01
    category: pkg
    task: "Understand the sqlite store's API surface"
    commands: ["pkg internal/kg/sqlite"]
    expected_symbols:
      - "Store.Save"
      - "Store.Delete"
      - "Store.Get"
      - "Store.Search"
    expected_files:
      - "internal/kg/sqlite/store.go"
    max_calls: 1
    difficulty: easy
    notes: "Should return all exported methods grouped logically."

  - id: orca-pkg-02
    category: pkg
    task: "Understand the MCP server's handler structure"
    commands: ["pkg internal/mcp/server"]
    expected_symbols:
      - "Router"
      - "RegisterKitTools"
    expected_files:
      - "internal/mcp/server/router.go"
      - "internal/mcp/server/tool_registry.go"
    max_calls: 1
    difficulty: medium
    notes: "Large package. Quality = can I identify the handler registration pattern? registerTool is unexported, not shown by pkg."

  - id: orca-pkg-03
    category: pkg
    task: "Understand the linker pipeline architecture"
    commands: ["pkg internal/kg/linker"]
    expected_symbols:
      - "Linker.Process"
      - "Deduplicator.CheckDuplicate"
      - "LLMQueue.ProcessBatch"
    expected_files:
      - "internal/kg/linker/linker.go"
      - "internal/kg/linker/dedup.go"
    max_calls: 1
    difficulty: medium
    notes: "Quality = do I understand the pipeline stages from the output?"

  # --- search tasks (concept → symbol, hardest category) ---

  - id: orca-search-01
    category: search
    task: "Find where FTS search queries are constructed"
    commands: ["search 'FTS'", "search 'searchFTS'"]
    expected_symbols:
      - "Store.searchFTS"  # internal/kg/sqlite/store.go:457
    expected_files:
      - "internal/kg/sqlite/store.go"
    max_calls: 2
    difficulty: hard
    notes: "Agent knows the concept but not the symbol name."

  - id: orca-search-02
    category: search
    task: "Find the mnemd daemon's processing loop"
    commands: ["search 'processCycle'", "search 'mnemd'"]
    expected_symbols:
      - "Daemon.processCycle"  # internal/proc/mnemd/daemon.go:144
      - "Daemon.Run"           # internal/proc/mnemd/daemon.go:95
    expected_files:
      - "internal/proc/mnemd/daemon.go"
    max_calls: 2
    difficulty: medium

  - id: orca-search-03
    category: search
    task: "Find where vault markdown files are scanned and parsed"
    commands: ["search 'ScanAll'", "search 'vault scan'"]
    expected_symbols:
      - "Scanner.ScanAll"      # internal/kg/vault/scanner.go:20
      - "Scanner.ScanWithMeta" # internal/kg/vault/scanner.go:48
    expected_files:
      - "internal/kg/vault/scanner.go"
    max_calls: 2
    difficulty: medium

  - id: orca-search-04
    category: search
    task: "Find the staleness/curation logic for nuggets"
    commands: ["search 'staleness'", "search 'curation'"]
    expected_symbols:
      - "Checker.GetCurationHints"  # internal/kg/staleness/staleness.go:83
      - "Checker.findStaleNuggets"  # internal/kg/staleness/staleness.go:121
    expected_files:
      - "internal/kg/staleness/staleness.go"
    max_calls: 2
    difficulty: hard
    notes: "Concept is vague — 'stale nuggets' could match many things."

  - id: orca-search-05
    category: search
    task: "Search for a nonexistent symbol"
    commands: ["search 'xyzzyplugh'"]
    expected_symbols: []
    expected_files: []
    max_calls: 1
    difficulty: easy
    notes: "Negative test — should return zero results cleanly, not error. Validates graceful empty response."

  # --- cross-cutting tasks (multi-step localization) ---

  - id: orca-cross-01
    category: cross-cutting
    task: "Change the embedding dimension — find all places that need updating"
    commands: ["def Embedder", "search 'dimension'", "search '1024'"]
    expected_symbols:
      - "Embedder"                # interface definition
      - "VoyageEmbedder"          # implementation
      - "voyageDefaultDimension"  # the 1024 constant
    expected_files:
      - "internal/kg/embedder/embedder.go"
      - "internal/kg/embedder/voyage.go"
    max_calls: 3
    difficulty: hard
    notes: "Requires finding interface + implementations + config constants."

  - id: orca-cross-02
    category: cross-cutting
    task: "Trace a nugget through the full save pipeline: API → linker → store"
    commands: ["def SaveNugget", "def Linker.Process", "def Store.Save"]
    expected_symbols:
      - "storeService.SaveNugget"
      - "Linker.Process"
      - "Store.Save"
    expected_files:
      - "internal/kg/mgmt/service.go"
      - "internal/kg/linker/linker.go"
      - "internal/kg/sqlite/store.go"
    max_calls: 3
    difficulty: hard
    notes: "End-to-end trace. Quality = can the agent reconstruct the data flow?"

  - id: orca-cross-03
    category: cross-cutting
    task: "Find the Embedder interface, its implementations, and who calls Embed"
    commands: ["impl Embedder", "refs Embedder", "callers Embed"]
    expected_symbols:
      - "Embedder"
    expected_files:
      - "internal/kg/embedder/embedder.go"
      - "internal/kg/embedder/"
    max_calls: 3
    difficulty: hard
    notes: "Interface → implementations → callers chain. Tests command composition for polymorphic code."

  # ==========================================================
  # Orca-specific workflow tasks
  # These target real development scenarios on the orca codebase
  # ==========================================================

  # --- MCP request lifecycle ---

  - id: orca-def-05
    category: def
    task: "Find the go_symbol MCP handler entry point"
    commands: ["def HandleGoSymbol"]
    expected_symbols:
      - "HandleGoSymbol"
    expected_files:
      - "internal/mcp/server/go_symbol_handler.go"
    max_calls: 1
    difficulty: easy
    notes: "This is snipe's own integration point in orca — the handler that wraps snipe for MCP."

  - id: orca-callees-02
    category: callees
    task: "Find what HandleGoSymbol calls during execution"
    commands: ["callees HandleGoSymbol"]
    expected_symbols:
      - "findGoSymbolViaSnipe"
      - "findGoSymbolFallback"
    expected_files:
      - "internal/mcp/server/go_symbol_handler.go"
    max_calls: 1
    difficulty: medium
    notes: "Should reveal: classifyQuery, findGoSymbolViaSnipe, findGoSymbolFallback, enrichWithKG — the full dispatch chain."

  - id: orca-cross-04
    category: cross-cutting
    task: "Trace an MCP tool call from registration to handler execution"
    commands: ["def Router.RegisterKitTools", "def Router.registerTool", "search 'goSymbolHandler'"]
    expected_symbols:
      - "Router.RegisterKitTools"
      - "Router.registerTool"
    expected_files:
      - "internal/mcp/server/router.go"
      - "internal/mcp/server/go_symbol_handler.go"
    max_calls: 3
    difficulty: hard
    notes: "How does a tool go from registration to execution? Router → registerTool → handler wiring."

  # --- Token estimation / truncation (cross-file sync) ---

  - id: orca-refs-04
    category: refs
    task: "Find all code that calls EstimateTokens or EstimateTokensFromText"
    commands: ["refs EstimateTokensFromText"]
    expected_symbols:
      - "EstimateTokensFromText"
    expected_files:
      - "internal/obs/telemetry/metrics/token_estimator.go"
      - "internal/mcp/response/truncation.go"
    max_calls: 1
    difficulty: medium
    notes: "Critical cross-file dependency: truncation.go imports token_estimator. Changing the ratio in one breaks the other."

  - id: orca-cross-05
    category: cross-cutting
    task: "Find all code involved in response truncation — estimator, truncation logic, and callers"
    commands: ["def TruncateResponse", "refs EstimateTokensFromText", "search 'charsPerToken'"]
    expected_symbols:
      - "TruncateResponse"
      - "EstimateTokensFromText"
    expected_files:
      - "internal/mcp/response/truncation.go"
      - "internal/obs/telemetry/metrics/token_estimator.go"
    max_calls: 3
    difficulty: hard
    notes: "Real maintenance scenario: charsPerToken is defined in two files that must stay in sync. Can the agent find both?"

  # --- NER pipeline ---

  - id: orca-def-06
    category: def
    task: "Find the NER extractor entry point"
    commands: ["def Extractor.ExtractFromEmail"]
    expected_symbols:
      - "Extractor.ExtractFromEmail"
    expected_files:
      - "internal/kg/ner/extractor.go"
    max_calls: 1
    difficulty: easy

  - id: orca-callees-03
    category: callees
    task: "Find what the NER email extractor calls"
    commands: ["callees Extractor.ExtractFromEmail"]
    expected_symbols:
      - "Extractor.ExtractFromEmail"
    expected_files:
      - "internal/kg/ner/extractor.go"
    max_calls: 1
    difficulty: medium
    notes: "Should reveal: ParseEmailHeaders, ExtractFromEmail (regex), LLMExtractor.ExtractWithPreExtracted — the extraction pipeline."

  - id: orca-search-06
    category: search
    task: "Find where email headers are parsed and entities extracted"
    commands: ["search 'ParseEmailHeaders'", "search 'entitiesFromAddress'"]
    expected_symbols:
      - "ParseEmailHeaders"
      - "entitiesFromAddress"
    expected_files:
      - "internal/kg/ner/email.go"
    max_calls: 2
    difficulty: medium
    notes: "Agent knows 'email parsing' but needs to find the specific functions."

  # --- LLM provider abstraction ---

  - id: orca-impl-03
    category: impl
    task: "Find all types that implement the LLM Provider interface"
    commands: ["impl Provider"]
    expected_symbols:
      - "AnthropicProvider"
      - "OpenAIProvider"
      - "OllamaProvider"
    expected_files:
      - "internal/util/llm/provider.go"
      - "internal/util/llm/openai.go"
      - "internal/util/llm/ollama.go"
    max_calls: 1
    difficulty: medium
    notes: "Three implementations. Tests impl on a real polymorphic abstraction with multiple concrete types."

  - id: orca-cross-06
    category: cross-cutting
    task: "Trace LLM usage from linker through provider to HTTP call"
    commands: ["callers Client.Reflect", "def Client.Reflect", "def NewProvider"]
    expected_symbols:
      - "Client.Reflect"
      - "NewProvider"
    expected_files:
      - "internal/util/llm/client.go"
      - "internal/util/llm/provider.go"
    max_calls: 3
    difficulty: hard
    notes: "How does orca call an LLM? Linker calls Client.Reflect, providers dispatch to HTTP APIs."

  # --- Code intelligence layer (snipe integration in orca) ---

  - id: orca-search-07
    category: search
    task: "Find where snipe is invoked from within orca"
    commands: ["search 'findGoSymbolViaSnipe'", "search 'snipe'"]
    expected_symbols:
      - "findGoSymbolViaSnipe"
    expected_files:
      - "internal/mcp/server/go_symbol_handler.go"
    max_calls: 2
    difficulty: medium
    notes: "Meta-task: snipe benchmarking snipe's own integration. findGoSymbolViaSnipe is the bridge."

  - id: orca-search-08
    category: search
    task: "Find the GoSymbolService and how it falls back between strategies"
    commands: ["search 'GoSymbolService'", "search 'textSearch'"]
    expected_symbols:
      - "GoSymbolService"
    expected_files:
      - "internal/kits/code/service/go_symbol_service.go"
    max_calls: 2
    difficulty: medium
    notes: "The service layer has snipe → gopls → ripgrep fallback chain. Can search surface the strategy?"

