# ============================================================
# Scoring rubric
# ============================================================
#
# Aligned with Agentless (ref:#379d10c): binary hit metrics at
# file and symbol granularity predict downstream success better
# than continuous metrics like MAP/MRR.
#
scoring:
  # Primary metrics (binary, per-task)
  file_accuracy:
    description: "Did snipe output contain at least one expected_file? (binary)"
    notes: "Maps to Agentless file-level % Correct Location"

  symbol_accuracy:
    description: "Did snipe output contain all expected_symbols? (binary)"
    notes: "Maps to Agentless function-level % Correct Location"

  call_efficiency:
    description: "actual_calls <= max_calls (binary pass/fail)"
    notes: "Unique to us — measures tool value vs grep baseline"

  # Optional / secondary (compute but don't optimize for)
  mrr:
    description: "1/rank of first expected symbol in output"
    notes: "Fine to report, but binary metrics are what correlate with solve rate"

  # Aggregates
  aggregates:
    - name: "file_acc"
      formula: "% of tasks where file_accuracy = true"
      target: "> 90% (LocAgent achieves 92.7%)"
    - name: "symbol_acc"
      formula: "% of tasks where symbol_accuracy = true"
      target: "> 75%"
    - name: "efficiency"
      formula: "% of tasks completed within max_calls"
      target: "> 80%"
    - name: "baseline_ratio"
      formula: "avg(snipe_calls) / avg(grep_calls) for same localization"
      target: "< 0.5 (snipe should be 2x fewer calls than grep)"

# ============================================================
# Task distribution (mirrors real usage)
# ============================================================
distribution:
  def: 6          # ~25% — most common single call
  callers: 5      # ~20% — impact analysis
  pkg: 3          # ~12% — orientation
  search: 8       # ~33% — concept-to-symbol, hardest
  cross-cutting: 5 # ~20% — multi-step traces
  # Total: 27 tasks across 5 codebases
