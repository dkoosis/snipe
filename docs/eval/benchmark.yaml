# Snipe Localization Benchmark
#
# Measures: can snipe get an LLM agent to the right code in minimal calls?
# Baseline: Grep + Glob + Read (the fallback stack)
#
# Scoring:
#   hit@1:    first result contains a target symbol
#   recall@N: all target symbols appear within top N results
#   calls:    number of snipe invocations to find all targets
#   baseline: number of Grep/Glob calls to achieve the same
#
# ============================================================
# Related work / existing benchmarks
# ============================================================
#
# Agentless (ICML 2024) — arxiv.org/abs/2407.01489
#   Hierarchical localization: file → class/function → line.
#   Evaluated on SWE-bench Lite (300 Python tasks from GitHub issues).
#   Metrics: Top-N, MAP, MRR at each granularity level.
#   Key finding: localization quality determines end-to-end fix rate.
#   Limitation for us: Python only, SWE-bench tasks, no Go.
#
# LocAgent (ACL 2025) — aclanthology.org/2025.acl-long.426
#   Graph-guided LLM agents for code localization.
#   Introduced Loc-Bench: 660 tasks (282 bugs, 203 features, 31 security, 144 perf).
#   Metrics: file-level accuracy (92.7%), function-level accuracy, NDCG.
#   Uses directed heterogeneous code graph (files, classes, functions + deps).
#   Closest to what we're doing — but evaluates the agent, not the tool.
#
# DeepCodeBench (Qodo, 2025) — qodo.ai/blog/deepcodebench
#   Q&A benchmark from real PRs requiring multi-file retrieval.
#   Metrics: "fact recall" (discrete verifiable facts in answer).
#   Tests retrieval depth, not just localization.
#   Best scores: ~76-80% fact recall. Claude ~64%.
#
# Jarmak (2026) — "Rethinking Coding Agent Benchmarks"
#   Key insight: current benchmarks containerize full repos, so
#   "grep is all you need" — doesn't test realistic retrieval.
#   Proposes: stripped-docs Kubernetes as harder target, ablation
#   studies with/without code intelligence tools (MCP).
#   Metrics: IR metrics (MRR, precision, recall, NDCG) + pass@k.
#   Pipeline: Harbor framework → SQLite metrics DB → analyzers.
#
# CrossCodeEval (NeurIPS 2023) — amazon-science/cceval
#   Cross-file code completion requiring cross-file context.
#   10k examples, 1k repos, 4 languages (no Go).
#   Metrics: exact match, edit similarity, identifier match.
#
# How this benchmark differs:
#   - Measures the TOOL (snipe), not the agent or LLM
#   - Go-specific, uses real symbol resolution not text search
#   - Baseline is grep+glob (the actual fallback), not "no tool"
#   - Focuses on call efficiency (fewer round-trips = faster agent)
#   - Reproducible without LLM: script snipe commands, check output

# ============================================================
# CHI (small codebase, ~5k LOC, HTTP router)
# repo: github.com/go-chi/chi
# ============================================================
chi:
  - id: chi-def-01
    category: def
    task: "Find the main route matching logic"
    commands: ["def Mux.routeHTTP"]
    expected_symbols:
      - "Mux.routeHTTP"
    max_calls: 1
    difficulty: easy

  - id: chi-def-02
    category: def
    task: "Find how URL parameters are extracted from requests"
    commands: ["def URLParam"]
    expected_symbols:
      - "URLParam"
    max_calls: 1
    difficulty: easy

  # --- refs ---

  - id: chi-refs-01
    category: refs
    task: "Find all code that references the Mux type"
    commands: ["refs Mux"]
    expected_symbols:
      - "Mux"
    expected_files:
      - "mux.go"
    max_calls: 1
    difficulty: medium
    notes: "Mux is the central type. Refs should appear across mux.go, tree.go, middleware, and tests."

  # --- callers ---

  - id: chi-callers-01
    category: callers
    task: "Find all places that add middleware to a router"
    commands: ["callers Mux.Use"]
    expected_symbols: []
    expected_files: []
    max_calls: 1
    difficulty: medium
    notes: "Callers returns functions that call Use. Callers are mostly in test files. No expected_files since test paths vary."

  # --- callees ---

  - id: chi-callees-01
    category: callees
    task: "Find what routeHTTP calls during request dispatch"
    commands: ["callees Mux.routeHTTP"]
    expected_symbols:
      - "node.FindRoute"
    expected_files:
      - "mux.go"
    max_calls: 1
    difficulty: medium
    notes: "Should reveal the route matching internals — tree walking, context setup, handler invocation."

  # --- pack ---

  - id: chi-pack-01
    category: pack
    task: "Get complete context for the Mux type"
    commands: ["pack Mux"]
    expected_symbols:
      - "Mux"
    expected_files:
      - "mux.go"
    max_calls: 1
    difficulty: easy
    notes: "Small codebase. Pack should give a complete picture of the central type."

  # --- impl ---

  - id: chi-impl-01
    category: impl
    task: "Find all types that implement the Router interface"
    commands: ["impl Router"]
    expected_symbols:
      - "Mux"
    expected_files:
      - "mux.go"
    max_calls: 1
    difficulty: medium
    notes: "chi.Router interface at chi.go:66. Mux is the primary implementation."

  # --- pkg ---

  - id: chi-pkg-01
    category: pkg
    task: "Understand chi's public API surface"
    commands: ["pkg chi"]
    expected_symbols:
      - "NewRouter"
      - "Mux"
      - "Route"
      - "Get"
      - "Post"
      - "Use"
      - "URLParam"
    max_calls: 1
    difficulty: easy
    notes: "Small package. All exports should fit in one call."

  # --- search ---

  - id: chi-search-01
    category: search
    task: "Find how chi builds its radix tree for route matching"
    commands: ["search 'radix'", "search 'trie'", "search 'addChild'"]
    expected_symbols:
      - "node"           # tree node type
      - "addChild"       # or insertRoute
    expected_files:
      - "tree.go"
    max_calls: 2
    difficulty: hard
    notes: "Concept-to-symbol. Agent knows 'radix tree' but not chi's internal names."

  - id: chi-search-02
    category: search
    task: "Find where chi allocates a fresh routing context for each request"
    commands: ["search 'context'", "def NewRouteContext"]
    expected_symbols:
      - "NewRouteContext"
    expected_files:
      - "context.go"
    max_calls: 2
    difficulty: hard
    notes: "MRR stressor (sn-4bxp): 'context' is high-fanout; NewRouteContext localizes (file+symbol pass) but ranks ~54/58. Rank quality is the discriminating signal now that binary metrics are saturated."

  # --- cross-cutting ---

  - id: chi-cross-01
    category: cross-cutting
    task: "Trace an HTTP request from ServeHTTP through route matching to handler execution"
    commands: ["def Mux.ServeHTTP", "def Mux.routeHTTP", "callers routeHTTP"]
    expected_symbols:
      - "Mux.ServeHTTP"
      - "Mux.routeHTTP"
    max_calls: 3
    difficulty: hard

  - id: chi-cross-02
    category: cross-cutting
    task: "Orientation: understand chi's structure then drill into the core type"
    commands: ["pkg chi", "def Mux", "pack Mux.ServeHTTP"]
    expected_symbols:
      - "Mux"
      - "Mux.ServeHTTP"
    expected_files:
      - "mux.go"
    max_calls: 3
    difficulty: medium
    notes: "Boot-style orientation workflow: pkg overview → type definition → deep dive."

# ============================================================
# COBRA (medium codebase, ~10k LOC, CLI framework)
# repo: github.com/spf13/cobra
# ============================================================
cobra:
  - id: cobra-def-01
    category: def
    task: "Find how a command is executed"
    commands: ["def Command.Execute"]
    expected_symbols:
      - "Command.Execute"
    max_calls: 1
    difficulty: easy

  - id: cobra-def-02
    category: def
    task: "Find how flags are parsed from arguments"
    commands: ["def Command.ParseFlags"]
    expected_symbols:
      - "Command.ParseFlags"
    max_calls: 1
    difficulty: easy

  - id: cobra-def-03
    category: def
    task: "Find the unexported execute method"
    commands: ["def Command.execute"]
    expected_symbols:
      - "Command.execute"
    expected_files:
      - "command.go"
    max_calls: 1
    difficulty: medium
    notes: "Lowercase unexported method. Tests whether def resolves private methods on exported types."

  # --- refs ---

  - id: cobra-refs-01
    category: refs
    task: "Find all code that references the Command type"
    commands: ["refs Command"]
    expected_symbols:
      - "Command"
    expected_files:
      - "command.go"
    max_calls: 1
    difficulty: hard
    notes: "Command is used everywhere in cobra. Tests whether refs handles high-fanout types. Many results expected."

  # --- callers ---

  - id: cobra-callers-01
    category: callers
    task: "Find all internal callers of command execution"
    commands: ["callers Command.execute"]
    expected_symbols:
      - "Command.ExecuteC"  # public wrapper that calls execute
    max_calls: 1
    difficulty: medium

  - id: cobra-callers-02
    category: callers
    task: "Find where the command's local (non-persistent) flag set is accessed"
    commands: ["callers Command.Flags"]
    expected_symbols:
      - "Command.LocalFlags"
    max_calls: 1
    difficulty: hard
    notes: "MRR stressor (sn-4bxp): Command.Flags has ~23 callers; LocalFlags is present but ranks ~3. File/symbol pass, MRR ~0.33."

  # --- callees ---

  - id: cobra-callees-01
    category: callees
    task: "Find what happens inside Command.execute"
    commands: ["callees Command.execute"]
    expected_symbols:
      - "Command.ParseFlags"
      - "Command.ValidateArgs"
    expected_files:
      - "command.go"
    max_calls: 1
    difficulty: medium
    notes: "execute is the core dispatch. Callees should reveal: flag parsing, pre-run hooks, run function, post-run hooks."

  # --- pack ---

  - id: cobra-pack-01
    category: pack
    task: "Get complete context for Command.Execute"
    commands: ["pack Command.Execute"]
    expected_symbols:
      - "Command.Execute"
      - "Command.ExecuteC"
    expected_files:
      - "command.go"
    max_calls: 1
    difficulty: easy
    notes: "Execute is the entry point. Pack should show def, who calls it, and what it calls."

  # --- search ---

  - id: cobra-search-01
    category: search
    task: "Find how shell completions are generated"
    commands: ["search 'completion'", "search 'bash completion'"]
    expected_symbols:
      - "GenBashCompletion"
      - "GenZshCompletion"
    expected_files:
      - "completions.go"
      - "bash_completions.go"
      - "zsh_completions.go"
    max_calls: 2
    difficulty: medium
    notes: "Multiple files involved. Quality = does the agent find all completion backends?"

  - id: cobra-search-02
    category: search
    task: "Find how help text is generated and customized"
    commands: ["search 'HelpFunc'", "search 'UsageFunc'"]
    expected_symbols:
      - "Command.Help"
      - "Command.HelpFunc"
      - "Command.SetHelpFunc"
      - "Command.UsageFunc"
    max_calls: 2
    difficulty: medium

  - id: cobra-search-03
    category: search
    task: "Find error handling patterns"
    commands: ["search 'error'", "search 'ErrHelp'"]
    expected_symbols: []
    expected_files:
      - "command.go"
    max_calls: 2
    difficulty: hard
    notes: "Deliberately vague query. Tests whether search surfaces useful results for broad concepts."

  - id: cobra-search-04
    category: search
    task: "Find the internal entry point that executes a command and returns the target command"
    commands: ["search 'execute'", "def Command.ExecuteC"]
    expected_symbols:
      - "Command.ExecuteC"
    expected_files:
      - "command.go"
    max_calls: 2
    difficulty: hard
    notes: "MRR stressor (sn-4bxp): 'execute' returns ~64 hits; ExecuteC ranks ~4. Localizes but ranking is weak, MRR ~0.25."

  # --- cross-cutting ---

  - id: cobra-cross-01
    category: cross-cutting
    task: "Trace argument validation from user input to error"
    commands: ["def Command.ValidateArgs", "search 'Args'", "def PositionalArgs"]
    expected_symbols:
      - "Command.ValidateArgs"
      - "PositionalArgs"       # type for arg validators
      - "MinimumNArgs"
      - "ExactArgs"
    max_calls: 3
    difficulty: hard

  - id: cobra-cross-02
    category: cross-cutting
    task: "Assess impact of changing Command.Execute"
    commands: ["refs Command.Execute", "callers Command.execute", "callees Command.execute"]
    expected_symbols:
      - "Command.Execute"
      - "Command.ExecuteC"
    expected_files:
      - "command.go"
    max_calls: 3
    difficulty: hard
    notes: "Impact analysis workflow: who uses it (refs) + who calls it (callers) + what it depends on (callees)."

# ============================================================
# BBOLT (small codebase, ~8k LOC, embedded key/value store)
# repo: go.etcd.io/bbolt
# ============================================================
bbolt:
  - id: bbolt-def-01
    category: def
    task: "Find how transactions are committed"
    commands: ["def Tx.Commit"]
    expected_symbols:
      - "Tx.Commit"
    max_calls: 1
    difficulty: easy

  - id: bbolt-def-02
    category: def
    task: "Find how buckets are created"
    commands: ["def Bucket.CreateBucket"]
    expected_symbols:
      - "Bucket.CreateBucket"
    max_calls: 1
    difficulty: easy

  # --- refs ---

  - id: bbolt-refs-01
    category: refs
    task: "Find all code that references the DB type"
    commands: ["refs DB"]
    expected_symbols:
      - "DB"
    expected_files:
      - "db.go"
    max_calls: 1
    difficulty: medium
    notes: "DB is the root type. Refs should span db.go, tx.go, bucket.go, and test files."

  # --- callers ---

  - id: bbolt-callers-01
    category: callers
    task: "Find all code that allocates new pages"
    commands: ["callers DB.allocate"]
    expected_symbols:
      - "Tx.allocate"   # direct caller; Tx.Commit reaches DB.allocate transitively via Tx.allocate
    max_calls: 1
    difficulty: hard
    notes: "Internal function. Tests whether callers resolves private methods. Direct caller only — Tx.Commit is 2-hop via Tx.allocate."

  # --- callees ---

  - id: bbolt-callees-01
    category: callees
    task: "Find what Tx.Commit calls during commit"
    commands: ["callees Tx.Commit"]
    expected_symbols:
      - "Tx.commitFreelist"
      - "Tx.write"
    expected_files:
      - "tx.go"
    max_calls: 1
    difficulty: medium
    notes: "Commit is complex — should reveal: page allocation, freelist management, data write, metadata sync."

  # --- search ---

  - id: bbolt-search-01
    category: search
    task: "Find the B+ tree node splitting logic"
    commands: ["search 'split'", "def node.split"]
    expected_symbols:
      - "node.split"
      - "node.splitIndex"
    expected_files:
      - "node.go"
    max_calls: 2
    difficulty: medium
    known_gap: true
    notes: "Unexported methods on unexported types not resolvable by def."

  - id: bbolt-search-02
    category: search
    task: "Find how the freelist tracks available pages"
    commands: ["search 'freelist'", "def freelist.free"]
    expected_symbols:
      - "freelist"
      - "freelist.free"
      - "freelist.allocate"
    expected_files:
      - "freelist.go"
    max_calls: 2
    difficulty: medium
    known_gap: true
    notes: "Unexported methods on unexported types not resolvable by def."

  # --- cross-cutting ---

  - id: bbolt-cross-01
    category: cross-cutting
    task: "Trace a Put operation from API through B+ tree to disk write"
    commands: ["def Bucket.Put", "def node.put", "callers node.spill"]
    expected_symbols:
      - "Bucket.Put"
      - "node.put"
      - "node.spill"
      - "Tx.Commit"
    max_calls: 3
    difficulty: hard
    known_gap: true
    notes: "Full write path. node.put and node.spill are unexported methods on unexported types."

