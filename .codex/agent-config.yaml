# Codex Agent Configuration for snipe

branch:
  pattern: "codex/issue-{number}-{slug}"
  max_slug_length: 30

pr:
  title_pattern: "{type}: {summary} (Fixes #{number})"
  types:
    - feat
    - fix
    - refactor
    - test
    - docs
    - chore

qa:
  pre_check: |
    source .codex/activate.sh
    command -v go &>/dev/null || { echo "Go not found. Run: bash .codex/setup.sh"; exit 1; }

  commands:
    - bash .codex/validate.sh

  fast_commands:
    - bash .codex/smoke-tests.sh

test:
  unit: go test ./...
  fast: go test -short ./...
  race: go test -race ./...

build:
  command: go build -o bin/snipe .
  output: bin/snipe

lint:
  command: golangci-lint run
  config: .golangci.yml

tools:
  required:
    - go
    - golangci-lint
    - mage
    - rg  # ripgrep for snipe search

environment:
  GOCACHE: .codex/cache/go-build
  GOMODCACHE: .codex/cache/mod
  GOLANGCI_LINT_CACHE: .codex/cache/golangci-lint
  GOTOOLCHAIN: local
