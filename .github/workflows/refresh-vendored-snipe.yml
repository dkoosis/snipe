name: refresh-vendored-snipe

# Keeps .sandbox/bin/linux-amd64/snipe within one push of HEAD. bot-review.yml's
# judge (cc-plugins actions/review-judge) scores every PR with `snipe risk`
# using this vendored binary — a manually-run `make cross` had let it drift
# 3+ months stale (found: Apr 28 binary vs an Aug 1 HEAD). Builds only the
# snipe binary directly (the PROJECT_BINS recipe from
# .sandbox/lib/Makefile.cross.mk), not the full `make cross-amd64` (which
# also rebuilds golangci-lint/govulncheck/fo/bat/etc — slow, network-heavy,
# unnecessary for this one binary).
#
# paths-ignore on its own commit prevents a rebuild loop.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.sandbox/bin/**'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux/amd64 snipe
        run: |
          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          mkdir -p .sandbox/bin/linux-amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.Version=$VERSION" \
            -o .sandbox/bin/linux-amd64/snipe .

      - name: Commit refreshed binary (if changed)
        run: |
          if git diff --quiet -- .sandbox/bin/linux-amd64/snipe; then
            echo "vendored snipe unchanged, nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .sandbox/bin/linux-amd64/snipe
          git commit -m "chore(sandbox): refresh vendored snipe binary [skip ci]"
          git push
