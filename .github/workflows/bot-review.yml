name: bot-review

# Judge-gated advisory bot review — thin caller for the ONE global pipeline
# (cc-plugins ccp-uzde). All logic lives in
# dkoosis/cc-plugins/.github/workflows/bot-review.yml; this stub only wires
# the triggers and passes this repo's secrets. Comment `@codex review` or
# `@gemini review` on any PR (drafts included) to force a review.
# Advisory only — nothing here gates merge; `make audit` remains the gate.
#
# The judge scores via `snipe risk <base> <head>` — this repo IS snipe, so
# the judge scores snipe PRs with snipe itself (self-hosting). It needs a
# vendored linux-amd64 binary at .sandbox/bin/linux-amd64/snipe (the judge's
# job runs on its own fresh runner with its own checkout — it can't consume
# a binary built by a step in THIS stub, since workflow_call jobs share no
# filesystem with the caller). refresh-vendored-snipe.yml keeps that binary
# within one push of HEAD instead of a manually-run `make cross` drifting for
# months. codex_prompt_file omitted: default (.github/codex/prompts/review.md)
# already matches this repo's prompt.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  bot-review:
    uses: dkoosis/cc-plugins/.github/workflows/bot-review.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      go_version: '1.26.5'
