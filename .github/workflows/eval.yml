name: eval

# Nightly quality gate. `make eval` fails when a score falls below the floors
# committed in test/eval/score.go; a floor moves only by a commit that says why.
# Cost: $0 a run. The eval clones four public repos and indexes them offline
# (--embed-mode=off); it calls no paid API.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false

      - name: install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: eval-setup
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          make eval-setup

      - name: eval
        run: make eval
