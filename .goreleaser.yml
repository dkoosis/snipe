---
version: 2
project_name: snipe

# No before-hook: the repo is fully vendored, so builds never fetch modules.
# The old `go mod download` hook hit the network and would 404 on the private
# github.com/dkoosis/keyring module (`go mod verify` is no better — it also
# downloads modules missing from a fresh runner's cache).

builds:
  - id: snipe
    main: .
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X github.com/dkoosis/snipe/cmd.Version={{ .Version }} -X github.com/dkoosis/snipe/cmd.GitCommit={{ .ShortCommit }}"

archives:
  - name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: dkoosis
    name: snipe
  prerelease: auto
  name_template: "v{{ .Version }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
